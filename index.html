<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOZ Spotřeby</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f0f2f5; color: #333; }
    h1 { text-align: center; margin-bottom: 20px; }
    .form-container { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .vehicle-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .vehicle-card h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #e0e0e0; padding-bottom: 5px; }
    .field-group { display: flex; align-items: center; margin: 8px 0; }
    .field-group label { font-size: .9rem; }
    .field-group input { width: 50px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: .9rem; margin-right: 8px; }
    #controls { text-align: center; margin: 20px 0; }
    #generateBtn { padding: 10px 20px; font-size: 1rem; border: none; border-radius: 5px; background: #007bff; color: #fff; cursor: pointer; }
    #generateBtn:hover { background: #0056b3; }
    #textZOZ { white-space: pre-wrap; background: #fff; border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>ZOZ Spotřeby</h1>
  <div class="form-container" id="zozForm"></div>
  <div id="controls">
    <button id="generateBtn" type="button">Vytvoř text</button>
  </div>
  <div id="textZOZ"></div>

  <script>
    const vehicles = [
      { id: 'cas32', name: 'CAS 32', fuel: 'nafta', consumption: { perKm: 0.52, perHour: 15, perHourWithPump: 31 } },
      { id: 'cas25', name: 'CAS 25', fuel: 'nafta', consumption: { perKm: 0.35, perHour: 10, perHourWithPump: 21 } },
      { id: 'oa', name: 'OA Fabia', fuel: 'benzín', consumption: { perKm: 0.1 } },
      { id: 'chainsaw', name: 'Motorová pila', fuel: 'benzín', consumption: { perHour: 2 } },
	  { id: 'floatingPump', name: 'Plovoucí čerpadlo', fuel: 'benzín', consumption: { perHour: 3 } }
    ];

    const form = document.getElementById('zozForm');
    vehicles.forEach(v => {
      const card = document.createElement('div');
      card.classList.add('vehicle-card');
      let html = `<h2>${v.name}</h2>`;

      // km
      if (v.consumption.perKm !== undefined) {
        html += `<div class='field-group'><label for='distance-${v.id}'>Ujeto km:</label><input id='distance-${v.id}' type='number' /></div>`;
      }

      // motohodiny bez/podle pumpy
      if (v.consumption.perHour !== undefined) {
        if (v.consumption.perHourWithPump !== undefined) {
          html += `<div class='field-group'><label for='${v.id}-hours'>Motohodin (bez čerpadla):</label><input id='${v.id}-hours' type='number' /><label for='${v.id}-minutes'>Minut:</label><input id='${v.id}-minutes' type='number' /></div>`;
          html += `<div class='field-group'><label for='pumpHours-${v.id}'>Motohodin (s čerpadlem):</label><input id='pumpHours-${v.id}' type='number' /><label for='pumpMinutes-${v.id}'>Minut:</label><input id='pumpMinutes-${v.id}' type='number' /></div>`;
        } else {
          html += `<div class='field-group'><label for='${v.id}-hours'>Motohodin:</label><input id='${v.id}-hours' type='number' /><label for='${v.id}-minutes'>Minut:</label><input id='${v.id}-minutes' type='number' /></div>`;
        }
      }

      card.innerHTML = html;
      form.appendChild(card);
    });

    document.getElementById('generateBtn').addEventListener('click', () => {
      let totalDiesel = 0, totalGasoline = 0, totalDistance = 0;
      let distanceText = '', consumptionText = '';

      vehicles.forEach(v => {
        const dist = parseFloat(document.getElementById(`distance-${v.id}`)?.value) || 0;
        const hrs = parseFloat(document.getElementById(`${v.id}-hours`)?.value) || 0;
        const mins = parseFloat(document.getElementById(`${v.id}-minutes`)?.value) || 0;
        const pumpH = parseFloat(document.getElementById(`pumpHours-${v.id}`)?.value) || 0;
        const pumpM = parseFloat(document.getElementById(`pumpMinutes-${v.id}`)?.value) || 0;
        const totalMth = (hrs + mins / 60).toFixed(1);
        const totalPumpMth = (pumpH + pumpM / 60).toFixed(1);

        // Ujeto
        if (v.consumption.perKm !== undefined && dist > 0) {
          distanceText += `${v.name} - ${dist}km\n`;
          totalDistance += dist;
        }
        if (v.consumption.perHour !== undefined && (hrs || mins)) {
          distanceText += `${v.name} - ${totalMth}Mth\n`;
        }

        // Spotřeba km
        if (v.consumption.perKm !== undefined && dist > 0) {
          const cons = v.consumption.perKm * dist / (v.consumption.unitKm || 1);
          consumptionText += `${v.name} - ${dist}km - ${cons.toFixed(1)}l ${v.fuel}\n`;
          v.fuel === 'nafta' ? totalDiesel += cons : totalGasoline += cons;
        }

        // Spotřeba Mth
		// Bez čerpadla jen pokud definováno
        if (v.consumption.perHourWithPump !== undefined && (hrs || mins)) {
          const cons = v.consumption.perHour * (hrs + mins / 60);
          consumptionText += `${v.name} Bez čerpadla - ${totalMth}Mth - ${cons.toFixed(1)}l ${v.fuel}\n`;
          v.fuel === 'nafta' ? totalDiesel += cons : totalGasoline += cons;
        }
        // S čerpadlem
        if (v.consumption.perHourWithPump !== undefined && (pumpH || pumpM)) {
          const consPump = v.consumption.perHourWithPump * (pumpH + pumpM / 60);
          consumptionText += `${v.name} S čerpadlem - ${totalPumpMth}Mth - ${consPump.toFixed(1)}l ${v.fuel}\n`;
          v.fuel === 'nafta' ? totalDiesel += consPump : totalGasoline += consPump;
        }
        // Ostatní stroje (bez pumpy)
        if (v.consumption.perHour !== undefined && (hrs || mins) && v.consumption.perHourWithPump === undefined) {
          const cons = v.consumption.perHour * (hrs + mins / 60);
          consumptionText += `${v.name} - ${totalMth}Mth - ${cons.toFixed(1)}l ${v.fuel}\n`;
          v.fuel === 'nafta' ? totalDiesel += cons : totalGasoline += cons;
        }
      });

      // Sestavení reportu
      let report = `Ujeto:\n${distanceText}\nSpotřeba PHM:\n${consumptionText}\nCelkem ujeto: ${totalDistance} km\nCelková spotřeba PHM: `;
      const parts = [];
      if (totalDiesel > 0) parts.push(`nafta: ${totalDiesel.toFixed(1)}`);
      if (totalGasoline > 0) parts.push(`benzín: ${totalGasoline.toFixed(1)}`);
      report += parts.join(', ');

      document.getElementById('textZOZ').innerText = report.trim();
    });
  </script>
</body>
</html>
